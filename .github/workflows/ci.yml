name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # 每周一 03:00 UTC 跑一次合同一致性——平台改了合同要提前收到红灯，
    # 而不是等用户撞 422。
    - cron: '0 3 * * 1'

jobs:
  test:
    name: 结构与提示词契约
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

  contract:
    name: 线上 OpenAPI 合同一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 抓不到线上合同时测试内部会 skip，不会把网络抖动算成失败。
      - run: npm run test:contract

  version-consistency:
    name: 版本一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 核对 VERSION / 两份 plugin.json / package.json / CHANGELOG
        run: |
          V=$(tr -d '[:space:]' < plugin/skills/workflow-update/VERSION)
          A=$(node -p "require('./plugin/plugin.json').version")
          C=$(node -p "require('./plugin/.claude-plugin/plugin.json').version")
          K=$(node -p "require('./package.json').version")
          echo "VERSION=$V plugin.json=$A .claude-plugin/plugin.json=$C package.json=$K"
          [ "$V" = "$A" ] && [ "$V" = "$C" ] && [ "$V" = "$K" ] || { echo "::error::版本号不一致"; exit 1; }
          grep -q "## \[$V\]" CHANGELOG.md || { echo "::error::CHANGELOG.md 缺少 $V 的条目"; exit 1; }
